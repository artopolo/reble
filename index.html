<script type="module">
import * as GS from '@mkkellogg/gaussian-splats-3d';
import * as THREE from 'three';

const BASE_H=4.5, M_PER_UNIT=39;      // 0.115 ед ≈ 4.5 м
const routeEl=document.getElementById('routeDone'), busEl=document.getElementById('bus'),
      fullRoute=document.getElementById('route'), RL=fullRoute.getTotalLength();
routeEl.style.strokeDasharray=RL; routeEl.style.strokeDashoffset=RL;
function setProgress(f){ f=Math.max(0,Math.min(1,f));
 routeEl.style.strokeDashoffset=RL*(1-f);
 const p=fullRoute.getPointAtLength(RL*f); busEl.setAttribute('cx',p.x); busEl.setAttribute('cy',p.y);
 document.getElementById('loadTxt').textContent = f<1 ? 'едем… '+Math.round(f*100)+'%' : 'приехали';
}
async function fetchProgress(url,weight,base){
 const r=await fetch(url); const total=+r.headers.get('Content-Length')||0;
 const reader=r.body.getReader(); const chunks=[]; let got=0;
 while(true){ const {done,value}=await reader.read(); if(done)break;
  chunks.push(value); got+=value.length; if(total)setProgress(base+weight*got/total); }
 return new Blob(chunks);   // без лишней копии 90 МБ — меньше памяти на телефоне
}

if(/Telegram|Instagram|FBAN|FBAV|VKClient/i.test(navigator.userAgent)) document.getElementById('inappHint').style.display='block';
const TRACK = await (await fetch('track.json')).json();
const DEM = await (await fetch('dem.json')).json();
function groundAt(x,z){
 const fx=(x-DEM.x0)/DEM.step, fz=(z-DEM.z0)/DEM.step;
 const ix=Math.max(0,Math.min(DEM.nx-2,Math.floor(fx))), iz=Math.max(0,Math.min(DEM.nz-2,Math.floor(fz)));
 const tx=Math.min(1,Math.max(0,fx-ix)), tz=Math.min(1,Math.max(0,fz-iz));
 const d=DEM.data, s=DEM.scale, w=DEM.nx;
 return (d[iz*w+ix]*(1-tx)*(1-tz)+d[iz*w+ix+1]*tx*(1-tz)+d[(iz+1)*w+ix]*(1-tx)*tz+d[(iz+1)*w+ix+1]*tx*tz)*s;
}
const N=TRACK.length;
const start=new THREE.Vector3(...TRACK[0]);
const INTRO=4;
const skyStart=new THREE.Vector3(start.x,start.y+0.8,start.z);

const viewer = new GS.Viewer({
 cameraUp:[0,1,0], initialCameraPosition:[skyStart.x,skyStart.y,skyStart.z], initialCameraLookAt:[start.x,start.y,start.z],
 sharedMemoryForWorkers:false, sphericalHarmonicsDegree:0, useBuiltInControls:false,
});
const IS_MOBILE=/iPhone|iPad|Android/i.test(navigator.userAgent);
const splatBlob = await fetchProgress(IS_MOBILE?'village_mobile.splat':'village_all.splat',0.33,0);   // скачивание = первая треть
let fake=0.33;
const anim=setInterval(()=>{ fake+=(0.97-fake)*0.06; setProgress(fake); },250); // сборка сцены = медленные две трети
const blobUrl=URL.createObjectURL(splatBlob);
await viewer.addSplatScene(blobUrl,{format:GS.SceneFormat.Splat,showLoadingUI:false,rotation:[1,0,0,0]});
URL.revokeObjectURL(blobUrl);
clearInterval(anim);
setProgress(1);
await new Promise(r=>setTimeout(r,600));
document.getElementById('load').remove();
viewer.start();
const cam=viewer.camera;
const scene=viewer.threeScene || viewer.splatMesh?.parent || null;

// ---- мягкое облако-надпись "РЕБЛЁ" над дорогой, проезжаем насквозь ----
function softSprite_unused(){
 const c=document.createElement('canvas'); c.width=c.height=64;
 const g=c.getContext('2d'); const grd=g.createRadialGradient(32,32,0,32,32,32);
 grd.addColorStop(0,'rgba(255,255,255,.9)'); grd.addColorStop(.4,'rgba(255,255,255,.35)'); grd.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=grd; g.fillRect(0,0,64,64);
 return new THREE.CanvasTexture(c);
}
function makeCloudTitle_unused(){
 const cnv=document.createElement('canvas'); cnv.width=1024; cnv.height=300;
 const g=cnv.getContext('2d');
 g.fillStyle='#000'; g.fillRect(0,0,1024,300);
 g.font='700 190px -apple-system,Helvetica'; g.fillStyle='#fff';
 g.textAlign='center'; g.textBaseline='middle'; g.fillText('РЕБЛЁ',512,150);
 const d=g.getImageData(0,0,1024,300).data;
 const pts=[], sz=[];
 for(let y=0;y<300;y+=2) for(let x=0;x<1024;x+=2){
  if(d[(y*1024+x)*4]>128 && Math.random()<0.5){
   pts.push((x-512)/512*1.6+(Math.random()-0.5)*0.03,
            (150-y)/512*1.6+(Math.random()-0.5)*0.03,
            (Math.random()-0.5)*0.18);
   }}
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
 const mat=new THREE.PointsMaterial({map:softSprite(),color:0xffffff,size:0.09,transparent:true,opacity:0.5,
  sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
 const cloud=new THREE.Points(geo,mat);
 // висит над дорогой чуть впереди старта, поперёк движения
 const a=new THREE.Vector3(...TRACK[6]), b=new THREE.Vector3(...TRACK[16]);
 cloud.position.set(b.x,(b.y+0.55),b.z);
 cloud.lookAt(a.x,a.y+0.55,a.z);
 cloud.userData.at=16;
 return cloud;
}


let phase='intro', t0=performance.now()/1000, idx=0;
let ride=false, rv=0, lat=0, steer=0, gas=0;
let yawOff=0,pitchOff=0,smYaw=null,smPos=null,endSlow=1;
let gyro=null,gyroOn=false,gyroGranted=false;
const qDevice=new THREE.Quaternion(), qYawFix=new THREE.Quaternion(), qCam=new THREE.Quaternion();
const zee=new THREE.Vector3(0,0,1), upAxis=new THREE.Vector3(0,1,0), qScr2=new THREE.Quaternion(), q1=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5)), qScr=new THREE.Quaternion(), eul=new THREE.Euler();
function scrAngle(){ return THREE.MathUtils.degToRad(screen.orientation?screen.orientation.angle:(window.orientation||0)); }
function devQuat(e,out){ // стандартный алгоритм DeviceOrientationControls (W3C ZXY)
 eul.set(THREE.MathUtils.degToRad(e.beta||0),THREE.MathUtils.degToRad(e.alpha||0),-THREE.MathUtils.degToRad(e.gamma||0),'YXZ');
 out.setFromEuler(eul); out.multiply(q1); out.multiply(qScr.setFromAxisAngle(zee,-scrAngle()));
 return out; }
if(!('ontouchstart' in window)) document.querySelector('.tglwrap').style.display='none';
// тихая проверка: если события уже идут — разрешение есть
addEventListener('deviceorientation',function probe(e){ if(e.alpha!==null){gyroGranted=true; gyro=e;} },{once:true});
addEventListener('deviceorientation',e=>{ if(gyroGranted) gyro=e; });
const $=id=>document.getElementById(id);

function pathPoint(i){ i=Math.max(0,Math.min(N-1.001,i));
 const j=Math.floor(i),f=i-j,A=TRACK[j],B=TRACK[Math.min(j+1,N-1)];
 return new THREE.Vector3(A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f); }
function pathDir(i){ const p=pathPoint(i),q=pathPoint(Math.min(i+8,N-1)); return Math.atan2(q.x-p.x,q.z-p.z); }
const lerpAngle=(a,b,t)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*t;};

const keysR={};
addEventListener('keydown',e=>keysR[e.code]=true);
addEventListener('keyup',e=>keysR[e.code]=false);
let drag=null;
addEventListener('pointerdown',e=>{if(e.target.closest('#ui')||e.target.closest('#gyroAsk'))return;drag=[e.clientX,e.clientY];});
addEventListener('pointermove',e=>{if(!drag)return;
 yawOff+=(e.clientX-drag[0])/innerWidth*3; pitchOff+=(e.clientY-drag[1])/innerHeight*2; drag=[e.clientX,e.clientY];});
addEventListener('pointerup',()=>drag=null);


function fmt(){
 let v=parseFloat($('sSpeed').value); if(Math.abs(v)<25){v=0;$('sSpeed').value=0;}
 const mult=(v/100); $('spdLab').textContent='x'+(Math.round(mult*10)/10).toString().replace('.0','');
 // позиция подписи над кружком
 const inp=$('sSpeed'), r=inp.getBoundingClientRect(), wrap=inp.parentElement.getBoundingClientRect();
 const f=(v-(-1000))/(2000);
 const pad=13, x=(r.left-wrap.left)+pad+f*(r.width-2*pad);
 $('spdLab').style.left=x+'px';
}
$('sSpeed').oninput=fmt; addEventListener('resize',fmt);
function crashNow(){ const c=document.getElementById('crash'); c.style.display='flex';
 setTimeout(()=>c.style.display='none',700); rv=0; lat=0; steer=0; }
// тач-газ: правая половина экрана — газ, левая — тормоз (в режиме поездки)
addEventListener('touchstart',e=>{ if(!ride)return; for(const t of e.touches){ if(t.clientY<innerHeight*0.75){ gas=(t.clientX>innerWidth/2)?1:-1; } } });
addEventListener('touchend',e=>{ if(!ride)return; if(e.touches.length===0)gas=0; });
$('bGyroT').onclick=async()=>{
 if(!gyroGranted){
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
    const r=await DeviceOrientationEvent.requestPermission();
    if(r!=='granted'){alert('Гироскоп не разрешён');return;} }
   gyroGranted=true;
  }catch(e){alert('Гироскоп недоступен');return;}
 }
 gyroOn=!gyroOn; $('bGyroT').classList.toggle('on',gyroOn);
 if(gyroOn&&gyro){ // якорь: совместить текущий взгляд по треку с текущей ориентацией телефона
  devQuat(gyro,qDevice);
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(qDevice);
  const yawDev=Math.atan2(f.x,f.z), yawPath=smYaw||0;
  qYawFix.setFromAxisAngle(new THREE.Vector3(0,1,0), yawPath-yawDev);
 } };
$('bRestart').onclick=()=>{const _u2=document.getElementById('ui');_u2.classList.remove('show');_u2.style.display='none';phase='intro';t0=performance.now()/1000;idx=0;yawOff=0;pitchOff=0;smYaw=null;smPos=null;endSlow=1;
 $('sSpeed').value=100;fmt();
};

let last=performance.now();
function tick(){
 requestAnimationFrame(tick);
 const now=performance.now(), dt=Math.min((now-last)/1000,0.1); last=now;
 const tsec=now/1000;
  let sv=parseFloat($('sSpeed').value); if(Math.abs(sv)<25)sv=0;
 const speed=sv/100;
 const hOff=0;

 if(phase==='intro'){
  const u=Math.min(1,(tsec-t0)/INTRO), e=u*u*(3-2*u);
  const p=new THREE.Vector3().lerpVectors(skyStart,start,e);
  cam.position.copy(p);
  const d0=pathDir(0);
  const hor=new THREE.Vector3(start.x+Math.sin(d0)*3,start.y,start.z+Math.cos(d0)*3);
  const look=new THREE.Vector3().lerpVectors(new THREE.Vector3(cx,0,cz),hor,e);
  cam.lookAt(look.x,look.y,look.z);
  if(u>=1){phase='track';smYaw=pathDir(0);smPos=start.clone();const _u=document.getElementById('ui');_u.style.display='flex';requestAnimationFrame(()=>_u.classList.add('show'));fmt();}
 } else if(ride){
  // мотоцикл: газ/тормоз + руль
  let g=gas, st=0;
  if(keysR['KeyW']||keysR['ArrowUp'])g=1;
  if(keysR['KeyS']||keysR['ArrowDown'])g=-1;
  if(keysR['KeyA']||keysR['ArrowLeft'])st=-1;
  if(keysR['KeyD']||keysR['ArrowRight'])st=1;
  st+= -yawOff*2; // свайп в поездке рулит
  yawOff*=Math.pow(0.05,dt);
  rv+= (g>0?14*dt:(g<0?-20*dt:0)); rv-=rv*1.2*dt; rv=Math.max(0,Math.min(28,rv));
  idx+=rv*dt; if(idx>N-2){idx=N-2;rv=0;} 
  lat+=st*0.25*dt*Math.min(1,rv/6);
  if(Math.abs(lat)>0.22){ crashNow(); }
  const p=pathPoint(idx), yawP=pathDir(idx);
  const rx=Math.cos(yawP), rz=-Math.sin(yawP); // right vector
  p.x+=rx*lat; p.z+=rz*lat;
  const pAh=pathPoint(Math.min(idx+4,N-1));
  p.y=Math.max(groundAt(p.x,p.z),groundAt(pAh.x,pAh.z))+0.15+Math.max(hOff,0)*0.3;
  if(!smPos)smPos=p.clone(); smPos.lerp(p,1-Math.pow(0.0005,dt));
  smYaw=(smYaw===null)?yawP:lerpAngle(smYaw,yawP+st*0.25,1-Math.pow(0.02,dt));
  smPos.y=Math.max(smPos.y, groundAt(smPos.x,smPos.z)+0.15);
  cam.position.copy(smPos);
  const yw=smYaw, pt2=-0.05;
  cam.lookAt(smPos.x+Math.sin(yw)*Math.cos(pt2),smPos.y+Math.sin(pt2),smPos.z+Math.cos(yw)*Math.cos(pt2));
 } else {
  if(idx>=N-30 && speed>0) endSlow=Math.max(0,(N-2-idx)/28); else endSlow=1;
  idx+=speed*endSlow*3*dt;
  if(idx<0)idx=0; if(idx>N-2)idx=N-2;
  const p=pathPoint(idx); p.y+=hOff; 
  if(!smPos)smPos=p.clone();
  smPos.lerp(p,1-Math.pow(0.001,dt));
  const targetYaw=pathDir(idx);
  smYaw=(smYaw===null)?targetYaw:lerpAngle(smYaw,targetYaw,1-Math.pow(0.02,dt));
  cam.position.copy(smPos);
  if(gyroOn&&gyro){                    // телефон + помощь пальцами
   devQuat(gyro,qDevice);
   qScr2.setFromAxisAngle(upAxis,yawOff);
   qCam.copy(qScr2).multiply(qYawFix).multiply(qDevice);
   cam.quaternion.copy(qCam);
   cam.rotateX(pitchOff*0.7);
  } else {
   const yaw=smYaw+yawOff, pit=Math.max(-1.3,Math.min(1.3,pitchOff));
   cam.lookAt(smPos.x+Math.sin(yaw)*Math.cos(pit),smPos.y+Math.sin(pit),smPos.z+Math.cos(yaw)*Math.cos(pit));
  }
 }
}
tick();
</script>
